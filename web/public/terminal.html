<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sietch // Terminal</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Xterm.js CSS and JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            color-scheme: dark;
            --bg: #121110;
            --surface: #1a1815;
            
            --text-primary: #eee7d9;
            --text-secondary: #9c9284;
            --accent: #dd9c3f;
            
            --border: rgba(238, 231, 217, 0.08);
            --border-strong: rgba(238, 231, 217, 0.15);
            --accent-soft: rgba(221, 156, 63, 0.12);
            
            --backdrop-bg: rgba(0, 0, 0, 0.4);
            --palette-bg: rgba(26, 24, 21, 0.85);
            --badge-bg: rgba(255, 255, 255, 0.05);
            
            --font-display: 'Space Grotesk', -apple-system, sans-serif;
            --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-display);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- Terminal ---------- */
        #terminal-wrapper {
            width: 100vw;
            height: 100vh;
            padding: 12px;
            box-sizing: border-box;
            background: var(--bg);
            display: flex;
        }

        #terminal-container {
            flex: 1;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .xterm-viewport::-webkit-scrollbar { width: 10px; }
        .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
        .xterm-viewport::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 5px; }
        .xterm-viewport::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* ---------- Command Palette ---------- */
        @keyframes palettePop {
            from { opacity: 0; transform: scale(0.96) translateY(-10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .cmd-palette-anim { animation: palettePop 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .cmd-item:hover { background: var(--accent-soft) !important; color: var(--accent) !important; }
    </style>
</head>
<body>
    <div id="terminal-wrapper">
        <div id="terminal-container"></div>
    </div>

    <!-- Command Palette HTML -->
    <div id="cmd-palette-backdrop" style="display:none; position: fixed; inset: 0; background: var(--backdrop-bg); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); z-index: 9999; justify-content: center; align-items: flex-start; padding-top: 15vh; opacity: 0; transition: opacity 0.15s;">
        <div id="cmd-palette" class="cmd-palette-anim" style="background: var(--palette-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-strong); border-radius: 12px; width: 100%; max-width: 550px; box-shadow: 0 30px 60px -15px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column;">
            <div style="padding: 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.75rem;">
                <i data-lucide="search" width="18" height="18" style="color: var(--accent);"></i>
                <input type="text" id="cmd-input" placeholder="Search terminal commands..." autocomplete="off" style="flex: 1; background: transparent; border: none; color: var(--text-primary); font-family: var(--font-display); font-size: 1.1rem; outline: none; box-shadow: none;">
                <div style="font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-secondary); background: var(--bg); padding: 0.2rem 0.4rem; border-radius: 4px; border: 1px solid var(--border);">ESC</div>
            </div>
            <div id="cmd-list" style="max-height: 350px; overflow-y: auto; padding: 0.5rem 0;"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const urlParams = new URLSearchParams(window.location.search);
        const sessionName = urlParams.get('session') || 'main';
        document.title = `Sietch // ${sessionName}`;

        // the font size and mouse setting from the dashboard's terminal settings (same browser)
        let prefs = {};
        try { prefs = JSON.parse(localStorage.getItem('arrakis_term_prefs')) || {}; } catch (e) {}
        const term = new Terminal({
            cursorBlink: true,
            cursorStyle: 'block',
            theme: {
                background: '#121110',
                foreground: '#eee7d9',
                cursor: '#dd9c3f',
                cursorAccent: '#121110',
                selectionBackground: 'rgba(238, 231, 217, 0.25)',
                black: '#1a1815',
                red: '#cc5c46',
                green: '#6fa287',
                yellow: '#dd9c3f',
                blue: '#0A84FF',
                magenta: '#b875a6',
                cyan: '#5b98a3',
                white: '#9c9284',
                brightBlack: '#6c6355',
                brightRed: '#e57a66',
                brightGreen: '#8bc2a5',
                brightYellow: '#fabf66',
                brightBlue: '#4ca1ff',
                brightMagenta: '#d496c4',
                brightCyan: '#7ab7c2',
                brightWhite: '#eee7d9'
            },
            fontFamily: 'var(--font-mono), "Menlo", "Monaco", "Courier New", monospace',
            fontSize: prefs.fontSize || 14,
            lineHeight: 1.2
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        
        setTimeout(() => fitAddon.fit(), 50);

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/api/term?session=${encodeURIComponent(sessionName)}${prefs.mouse !== false ? '&mouse=1' : ''}`;
        const ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            term.focus();
            fitAddon.fit();
            ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
        };

        ws.onmessage = (event) => term.write(event.data);

        ws.onclose = () => {
            term.write('\r\n\x1b[31m[Disconnected from server]\x1b[0m\r\n');
        };

        term.onData((data) => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'input', data: data }));
            }
        });

        const resizeObserver = new ResizeObserver(() => {
            requestAnimationFrame(() => {
                if (!term.element) return;
                fitAddon.fit();
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
                }
            });
        });
        resizeObserver.observe(document.getElementById('terminal-wrapper'));

        window.sendTmux = function(commandStr) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'input', data: '\x02' + commandStr }));
                term.focus();
            }
        };

        // ---------- Command Palette Logic ----------
        const backdrop = document.getElementById('cmd-palette-backdrop');
        const cmdInput = document.getElementById('cmd-input');
        const cmdList = document.getElementById('cmd-list');
        let selectedIndex = 0;
        let filteredCommands = [];

        const commands = [
            { category: 'Pane Management', title: 'Split Pane Vertically', icon: 'columns', shortcut: '⌘⇧V', action: () => sendTmux('%') },
            { category: 'Pane Management', title: 'Split Pane Horizontally', icon: 'rows', shortcut: '⌘⇧H', action: () => sendTmux('"') },
            { category: 'Pane Management', title: 'Close Current Pane', icon: 'x', shortcut: '⌘⇧X', action: () => sendTmux('xy') },
            { category: 'Pane Management', title: 'Toggle Pane Zoom (Fullscreen)', icon: 'maximize', shortcut: '⌘⇧Z', action: () => sendTmux('z') },
            { category: 'Pane Management', title: 'Cycle Focus to Next Pane', icon: 'corner-down-right', shortcut: '⌘⇧O', action: () => sendTmux('o') },
            
            { category: 'Window Management', title: 'Create New Window', icon: 'plus-square', shortcut: '⌘⇧C', action: () => sendTmux('c') },
            { category: 'Window Management', title: 'Next Window', icon: 'arrow-right-circle', shortcut: '⌘⇧N', action: () => sendTmux('n') },
            { category: 'Window Management', title: 'Previous Window', icon: 'arrow-left-circle', shortcut: '⌘⇧[', action: () => sendTmux('p') },
            { category: 'Window Management', title: 'Rename Current Window', icon: 'edit-2', shortcut: '⌘⇧,', action: () => sendTmux(',') },
            
            { category: 'Session', title: 'Detach from Session', icon: 'log-out', shortcut: '⌘⇧D', action: () => sendTmux('d') }
        ];

        function togglePalette() {
            if (backdrop.style.display === 'none') {
                backdrop.style.display = 'flex';
                void backdrop.offsetWidth; 
                backdrop.style.opacity = '1';
                cmdInput.value = '';
                selectedIndex = 0;
                renderPalette();
                setTimeout(() => cmdInput.focus(), 50);
            } else {
                backdrop.style.opacity = '0';
                setTimeout(() => { backdrop.style.display = 'none'; }, 150);
                term.focus();
            }
        }

        function multiWordMatch(query, targetStr) {
            const words = query.toLowerCase().split(/\s+/).filter(Boolean);
            const target = targetStr.toLowerCase();
            return words.every(w => target.includes(w));
        }

        function renderPalette() {
            const query = cmdInput.value.trim();
            filteredCommands = commands.filter(c => query === '' || multiWordMatch(query, c.title + ' ' + c.category));
            if (selectedIndex >= filteredCommands.length) selectedIndex = Math.max(0, filteredCommands.length - 1);
            
            if (filteredCommands.length === 0) {
                cmdList.innerHTML = `<div style="padding: 2rem 1rem; text-align: center; color: var(--text-secondary); font-size: 0.9rem;">No matching commands found.</div>`;
                return;
            }

            let html = '';
            let currentCat = '';
            filteredCommands.forEach((c, i) => {
                if (c.category !== currentCat) {
                    currentCat = c.category;
                    html += `<div style="font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-secondary); padding: 1rem 1.25rem 0.4rem; text-transform: uppercase; letter-spacing: 0.05em;">${currentCat}</div>`;
                }
                const isSel = i === selectedIndex;
                html += `
                    <div class="cmd-item" data-idx="${i}" style="padding: 0.65rem 1.25rem; display: flex; align-items: center; gap: 0.75rem; cursor: pointer; color: ${isSel ? 'var(--accent)' : 'var(--text-secondary)'}; background: ${isSel ? 'var(--accent-soft)' : 'transparent'}; border-left: 2px solid ${isSel ? 'var(--accent)' : 'transparent'}; transition: all 0.1s ease;">
                        <i data-lucide="${c.icon}" width="15" height="15"></i>
                        <span style="font-size: 0.85rem; flex:1;">${c.title}</span>
                        ${c.shortcut ? `<span style="font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-secondary); background: var(--badge-bg); padding: 0.15rem 0.4rem; border-radius: 4px;">${c.shortcut}</span>` : ''}
                    </div>
                `;
            });
            cmdList.innerHTML = html;
            lucide.createIcons({root: cmdList});
        }

        function executeSelected() {
            if (filteredCommands[selectedIndex]) {
                filteredCommands[selectedIndex].action();
                togglePalette();
            }
        }

        cmdInput.addEventListener('input', () => { selectedIndex = 0; renderPalette(); });
        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                selectedIndex = Math.min(selectedIndex + 1, filteredCommands.length - 1);
                renderPalette();
                cmdList.querySelectorAll('.cmd-item')[selectedIndex]?.scrollIntoView({block: 'nearest'});
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                selectedIndex = Math.max(selectedIndex - 1, 0);
                renderPalette();
                cmdList.querySelectorAll('.cmd-item')[selectedIndex]?.scrollIntoView({block: 'nearest'});
            } else if (e.key === 'Enter') {
                e.preventDefault();
                executeSelected();
            }
        });

        backdrop.addEventListener('click', (e) => {
            if (e.target === backdrop) togglePalette();
            else {
                const item = e.target.closest('.cmd-item');
                if (item) {
                    selectedIndex = parseInt(item.dataset.idx);
                    executeSelected();
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.metaKey || e.ctrlKey) {
                const key = e.key.toLowerCase();
                
                // Cmd/Ctrl + P (No Shift) -> Command Palette
                if (key === 'p' && !e.shiftKey) {
                    e.preventDefault(); 
                    togglePalette();
                }
                
                // Cmd/Ctrl + Shift + Key -> Terminal Commands
                if (e.shiftKey) {
                    if (['v', 'h', 'x', 'd', 'z', 'o', 'c', 'n', '[', '{', ',', '<'].includes(key)) {
                        e.preventDefault(); 
                        if (key === 'v') sendTmux('%');
                        else if (key === 'h') sendTmux('"');
                        else if (key === 'x') sendTmux('xy');
                        else if (key === 'd') sendTmux('d');
                        else if (key === 'z') sendTmux('z');
                        else if (key === 'o') sendTmux('o');
                        else if (key === 'c') sendTmux('c');
                        else if (key === 'n') sendTmux('n');
                        else if (key === '[' || key === '{') sendTmux('p');
                        else if (key === ',' || key === '<') sendTmux(',');
                    }
                }
            }
            if (e.key === 'Escape' && backdrop.style.display === 'flex') {
                togglePalette();
            }
        });
    </script>
</body>
</html>
